# 分镜画布：带口令的反向代理（HTTP + HTTPS）
#
# 为什么需要这一层：应用本身没有登录，而 GET /api/settings 会明文返回
# 各渠道的 API Key。公网只暴露这个代理，应用容器只绑宿主机回环。
#
# 证书：deploy/ssl/fullchain.pem + privkey.key（目标机上放置，不进仓库）。
# 域名绑定 rechargeai.cn / www.rechargeai.cn；用 IP 访问仍走 80 的 HTTP。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 域名 HTTP → HTTPS
server {
    listen 80;
    server_name rechargeai.cn www.rechargeai.cn;
    return 301 https://$host$request_uri;
}

# IP / 未绑定域名：HTTP 直接访问；/healthz 不需要口令
server {
    listen 80 default_server;
    server_name _;

    # 视频素材上传
    client_max_body_size 512m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    include /etc/nginx/includes/app-locations.conf;
}

# 域名 HTTPS：Basic Auth + 应用转发
server {
    listen 443 ssl;
    http2 on;
    server_name rechargeai.cn www.rechargeai.cn;

    client_max_body_size 512m;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    include /etc/nginx/includes/app-locations.conf;
}
