# 分镜画布：独立端口模式（不占用域名）
#
# 什么时候用这份：域名归别的服务（例如同机的官网/商城）时，本应用只能通过
# 独立端口访问。此时不能保留「域名 HTTP → HTTPS」的 301，否则
# https://域名:8443/ 也会被跳到对方的 443，等于自己把自己挡掉。
#
# 因此这里在 80/443 上各只留一个 default_server，容器内仍监听 80/443，
# 由 compose 把宿主机端口映射进来（如 8080→80、8443→443）。
# 证书为可选：deploy/ssl 不存在时会回落到纯 HTTP（只映射 8080 即可）。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # 视频素材上传
    client_max_body_size 512m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    include /etc/nginx/includes/app-locations.conf;
}

server {
    listen 443 ssl default_server;
    server_name _;

    client_max_body_size 512m;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    include /etc/nginx/includes/app-locations.conf;
}
