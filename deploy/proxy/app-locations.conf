# 应用转发段：80（IP 访问）与 443（域名访问）共用
# 口令行必须保留：GET /api/settings 会明文返回渠道 Key。

auth_basic "storyboard";
auth_basic_user_file /etc/nginx/auth/.htpasswd;

location = /healthz {
    auth_basic off;
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
}

# 桌面端共用账号：这两个前缀自身带会话校验，不能再套 Basic Auth。
# 打包后的桌面端没有口令输入框，转发时会话要能直接进去；其余接口（尤其会明文
# 回传渠道 Key 的 /api/settings）仍然必须过口令。
location ^~ /api/auth/ {
    auth_basic off;
    proxy_pass http://app:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4m;
}

location ^~ /api/billing/ {
    auth_basic off;
    proxy_pass http://app:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4m;
}

# 计费模型接口：桌面端共用账号后要能直接调用（会话校验在应用里）。
# 匿名请求会被 /api/text 自身的登录校验挡回 401，不会产生消费。
location = /api/text {
    auth_basic off;
    proxy_pass http://app:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 32m;
}

location = /api/seedream {
    auth_basic off;
    proxy_pass http://app:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 32m;
}

location = /api/seedance {
    auth_basic off;
    proxy_pass http://app:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 64m;
}

# 虎皮椒异步通知、邮箱验证：第三方/邮件不能带 Basic Auth
location = /api/billing/xunhupay/notify {
    auth_basic off;
    proxy_pass http://app:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 4m;
}

# 会话探测子请求：给下面的静态媒体做「口令或已登录」二选一放行
location = /_sb_session_check {
    internal;
    auth_basic off;
    proxy_pass http://app:5273/api/auth/session-check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 生成产物：浏览器用户靠 Basic Auth，桌面端靠会话 Cookie。
# 桌面端不持有网站口令，但登录后带着 sb_session，这里用 auth_request 放行。
location ~ ^/(generated|videos|voices|exports|publish-packages)/ {
    auth_basic "storyboard";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;
    auth_request /_sb_session_check;
    satisfy any;

    proxy_pass http://app:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 视频拖进度要原样透传 Range，不能整段缓冲
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 512m;
}

location ^~ /api/auth/verify {
    auth_basic off;
    proxy_pass http://app:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://app:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # 文本流式返回、视频任务轮询与长耗时合成
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
