<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Crect x='6' y='9' width='9' height='14' rx='2' fill='%2338bdf8'/%3E%3Crect x='18' y='9' width='8' height='6' rx='2' fill='%23fbbf24'/%3E%3C/svg%3E"
    />
    <title>分镜画布 · Storyboard Canvas</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 在 React 挂载前应用主题，避免首屏闪白/闪黑
      (() => {
        let mode = 'night'
        try {
          const saved = localStorage.getItem('storyboard-theme')
          if (saved === 'day' || saved === 'night') mode = saved
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) mode = 'day'
        } catch {
          try {
            if (window.matchMedia('(prefers-color-scheme: light)').matches) mode = 'day'
          } catch {
            /* 保持夜间 */
          }
        }
        document.documentElement.dataset.theme = mode
        document.documentElement.style.colorScheme = mode === 'day' ? 'light' : 'dark'
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
