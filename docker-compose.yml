# 分镜画布 · 应用编排
#
# 只起应用本体；抖音/TikTok 的下载能力由 DTK 提供，它是独立仓库、独立 compose
# 项目（见 deploy/README.md 与 scripts/dtk-up.sh）。这样做的原因：
# DTK 的 compose 刻意把 port 只绑到 127.0.0.1，并依赖它自己的 .env 与迁移流程，
# 塞进本文件会破坏它原有的安全假设。
#
# 用法：
#   cp deploy/.env.example .env
#   docker compose up -d --build
#
# 或直接用一键脚本：./scripts/deploy-up.sh

name: storyboard

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: storyboard-canvas:local
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDR:-127.0.0.1}:${APP_PORT:-5273}:5273"
    environment:
      # 项目库与创意源视频都在这里（creatives 是 projects 的子目录）
      SB_PROJECTS_DIR: /data/projects
      # 运行时媒体根：生成产物 / 视频 / 配音 / 导出 / 发布包
      # 映射到 ./data/media，与旧版逐个挂 public 子目录的落点完全一致，无需搬数据
      SB_MEDIA_ROOT: /data/media
      # 渠道 Key：留空则该渠道不可用，不会串到别的渠道
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_AGENT_PLAN_API_KEY: ${ARK_AGENT_PLAN_API_KEY:-}
      APIB_API_KEY: ${APIB_API_KEY:-}
      APIMART_API_KEY: ${APIMART_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      VOLC_TTS_API_KEY: ${VOLC_TTS_API_KEY:-}
      SYNC_LABS_API_KEY: ${SYNC_LABS_API_KEY:-}
      # 创意摄取：DTK 优先（抖音），yt-dlp 兜底（B 站/直链）
      DTK_BASE_URL: ${DTK_BASE_URL:-}
      DTK_API_KEY: ${DTK_API_KEY:-}
      YTDLP_BIN: /usr/local/bin/yt-dlp
      YTDLP_COOKIES_FROM_BROWSER: ${YTDLP_COOKIES_FROM_BROWSER:-}
      # Blender 随镜像安装；容器里没有 GPU，EEVEE 的 GPU 后端在后台模式不可用，
      # 因此默认引擎为 cycles（纯 CPU）。本机装了 GPU 时可覆盖 BLENDER_ENGINE=eevee。
      BLENDER_BIN: ${BLENDER_BIN:-/usr/local/bin/blender}
      BLENDER_ENGINE: ${BLENDER_ENGINE:-cycles}
      # 出图/出片超时（秒级任务用不到，但慢渠道可调）
      SEEDREAM_TIMEOUT_MS: ${SEEDREAM_TIMEOUT_MS:-180000}
      # 平台计费（虎皮椒 / 用户钱包）
      BILLING_DB_PATH: ${BILLING_DB_PATH:-/data/projects/billing.sqlite}
      BILLING_ADMIN_EMAIL: ${BILLING_ADMIN_EMAIL:-}
      BILLING_EMAIL_DRIVER: ${BILLING_EMAIL_DRIVER:-console}
      BILLING_ALLOW_SIMULATE: ${BILLING_ALLOW_SIMULATE:-0}
      XUNHUPAY_APPID: ${XUNHUPAY_APPID:-}
      XUNHUPAY_SECRET: ${XUNHUPAY_SECRET:-}
      XUNHUPAY_GATEWAY: ${XUNHUPAY_GATEWAY:-https://api.xunhupay.com}
      XUNHUPAY_NOTIFY_URL: ${XUNHUPAY_NOTIFY_URL:-}
    volumes:
      # 业务数据：SQLite + 项目媒体 + 创意源视频与证据帧
      - ./data/projects:/data/projects
      # 媒体根：可重生成的产物（generated/videos/voices/exports/publish-packages）
      # 与旧版四个 public 子目录挂载一一对应，历史文件原地可用
      - ./data/media:/data/media
    # 让容器能用 host.docker.internal 访问宿主机上跑的 DTK
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5273/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
